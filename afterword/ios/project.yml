# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Afterword
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer team id
targets:
  Afterword:
    type: application
    platform: iOS
    sources: [Afterword]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.afterword   # change before submitting
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Afterword/Info.plist
      properties:
        CFBundleDisplayName: Afterword
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        AfterwordServerURL: http://localhost:8787
        NSMicrophoneUsageDescription: Afterword records your voice when you choose to tell a story out loud, so your words can be transcribed into your archive.
        NSSpeechRecognitionUsageDescription: Afterword turns your spoken stories into text on your device so they can become part of your archive.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
