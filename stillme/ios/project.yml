# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: StillMe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer team id
targets:
  StillMe:
    type: application
    platform: iOS
    sources: [StillMe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stillme   # change before submitting
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: StillMe/Info.plist
      properties:
        CFBundleDisplayName: Still Me
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        StillMeServerURL: http://localhost:8787
        NSMicrophoneUsageDescription: Still Me records your voice when you choose to tell a story out loud, so your words can be transcribed into your archive.
        NSSpeechRecognitionUsageDescription: Still Me turns your spoken stories into text on your device so they can become part of your archive.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
