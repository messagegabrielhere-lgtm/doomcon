name: si-probe
# One-off, read-only: compare GitHub search qualifiers for AI coding-agent PRs
# so Takeover Watch counts the right thing. Results are written as notices.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe search qualifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          for q in "author:app/copilot-swe-agent" "author:Copilot" "author:app/devin-ai-integration" "author:app/chatgpt-codex-connector" "author:app/cursor" "author:app/claude" "author:app/google-labs-jules" "head:codex/" "head:cursor/" "head:claude/" "head:copilot/" "head:devin/" "head:jules/" "label:codex" "in:body \"Generated with [Claude Code]\"" "in:body \"Co-Authored-By: Claude\"" "in:body \"jules.google\"" "in:body \"chatgpt.com/codex\"" "in:body \"cursor.com/agents\""; do
            n=$(gh api -X GET search/issues -f q="is:pr $q created:>=$S" -f per_page=1 --jq .total_count 2>&1 | head -1)
            echo "::notice title=probe::$q => $n"
            sleep 3
          done
