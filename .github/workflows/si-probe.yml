name: si-probe
# One-off, read-only diagnostics for Takeover Watch counts. Notices only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compare collector vs gh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          for q in "author:app/copilot-swe-agent" "head:codex/"; do
            a=$(gh api -X GET search/issues -f q="is:pr $q created:>=$S" -f per_page=1 --jq '"\(.total_count) inc=\(.incomplete_results)"')
            u="https://api.github.com/search/issues?q=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "is:pr $q created:>=$S")&per_page=1"
            b=$(curl -s -H "authorization: Bearer $GITHUB_TOKEN" -H "accept: application/vnd.github+json" "$u" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.total_count+" inc="+j.incomplete_results+" "+(j.message||""))})')
            c=$(node --input-type=module -e "import { searchCount } from './collector/si-signals.mjs'; const r = await searchCount(process.argv[1], { headers: { accept: 'application/vnd.github+json', authorization: 'Bearer ' + process.env.GITHUB_TOKEN } }); console.log(JSON.stringify(r));" "is:pr $q created:>=$S" 2>&1 | tail -1)
            echo "::notice title=probe $q::gh=$a | curl=$b | collector=$c"
            sleep 3
          done
