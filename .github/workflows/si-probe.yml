name: si-probe
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          S=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "::notice title=probe-auth::$(gh api -X GET search/issues -f q="is:pr author:app/copilot-swe-agent created:>=$S" -f per_page=1 --jq .total_count)"
          echo "::notice title=probe-anon::$(curl -s "https://api.github.com/search/issues?q=is:pr+author:app/copilot-swe-agent+created:%3E%3D$S&per_page=1" | jq .total_count)"
