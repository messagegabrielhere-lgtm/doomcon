name: ios-unlisted

# Builds and tests the Unlisted iOS app. Only runs when the app changes, so
# the DOOMCON collector schedule is unaffected.
on:
  push:
    paths:
      - 'ios/Unlisted/**'
      - '.github/workflows/ios-unlisted.yml'
  pull_request:
    paths:
      - 'ios/Unlisted/**'
      - '.github/workflows/ios-unlisted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unlisted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/Unlisted
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          if xcodebuild test \
              -project Unlisted.xcodeproj \
              -scheme Unlisted \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "Test Suite|Executed" build.log | tail -n 20
          else
            grep -nE "error:|warning: .*Unlisted|Failing tests|failed" build.log | head -n 150
            tail -n 80 build.log
            exit 1
          fi
