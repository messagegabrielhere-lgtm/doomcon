# Big investors (/arena.html#investors): disclosed trades from
#   - SEC Form 4 (AI-equity insider watchlist; ≤2 business days)
#   - SEC 13F (fund managers; quarterly)
#   - ARK daily ETF holdings
#   - House periodic transaction reports (Congress)
#
# Like the scanner and the arena, this never touches main. Output lives on the
# investors-data branch as one orphan commit, force-pushed. state.json there
# holds yesterday's ARK holdings (to diff against), cached Form 4 ownership
# docs, and the House reports already parsed; delete the branch to start over.
#
# SEC refuses automated clients unless the User-Agent names who is asking with
# a contact email, and it 403s any User-Agent containing "github". The default
# below is the repository owner's; the repository variable SEC_UA overrides it.
# Do not put a GitHub noreply address in that variable.

name: investors

on:
  schedule:
    - cron: '17 12 * * 1-5'   # morning: House reports + overnight Form 4s
    - cron: '17 16 * * 1-5'   # mid-US-day: newer Form 4s as EDGAR posts them
    - cron: '47 23 * * 1-5'   # evening: after ARK posts the day's holdings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: investors
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the PDF reader
        # Only this job needs it, so it isn't in package.json. Its optional
        # @napi-rs/canvas supplies DOMMatrix, which pdf.js needs under Node.
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pdfjs-dist@5.6.205

      - name: Load state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch investors-data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/investors" \
            || mkdir -p "$RUNNER_TEMP/investors"
          rm -rf "$RUNNER_TEMP/investors/.git"

      - name: Collect
        env:
          # The owner's contact, at their request; the variable overrides it.
          SEC_UA: ${{ vars.SEC_UA }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node investors/collect.mjs --dir "$RUNNER_TEMP/investors"

      - name: Publish to investors-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/investors"
          git init -q -b investors-data
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Investors $(date -u +%Y-%m-%dT%H:%MZ)"
                    git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" investors-data
