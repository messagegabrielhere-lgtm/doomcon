# Error tracking for a static site: when the pipelines that publish the index
# fail, shout in the run summary so an operator sees it before visitors do.
# Also probe the live API after every collect — a green run that published
# DEGRADED because of a rate limit is the failure mode visitors actually see,
# and GitHub's "workflow failed" mail never fires for it.
#
# GitHub also emails the repo owner on workflow failure when notifications
# are enabled (Settings → Notifications → Actions) — turn that on.
#
# This workflow does not page a third-party SaaS. Wire a Slack webhook later
# if you want (secret SLACK_WEBHOOK_URL); until then the Actions failure mail
# and this summary are the pager.

name: watchdog

on:
  workflow_run:
    workflows: [collect, news-fast, arena, post-daily, clipper, monitor-data]
    types: [completed]
  schedule:
    # Mid-hour probe: catch a DEGRADED reading that the full lane published
    # before its heal ladder could clear, or a dropped :07 cron.
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Also probe the live homepage and API'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  watch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'collect' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'monitor-data' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report upstream failure
        if: github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
        env:
          NAME: ${{ github.event.workflow_run.name }}
          CONCLUS: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "::error title=Pipeline failed::${NAME} finished ${CONCLUS} on ${BRANCH}"
          {
            echo "### SIREN watchdog"
            echo ""
            echo "- **workflow:** ${NAME}"
            echo "- **conclusion:** ${CONCLUS}"
            echo "- **branch:** ${BRANCH}"
            echo "- **run:** ${URL}"
            echo ""
            echo "Open the run, fix or revert (docs/ROLLBACK.md), then re-run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe live homepage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        run: |
          set -e
          URL="https://siren.watch/"
          # curl -w prints 000 and exits non-zero on a timeout. `|| echo 000`
          # appended a second 000, so one blip was reported as HTTP 000000
          # (2026-10-20 06:28Z). Retry once: that run burned the whole 25s budget.
          probe() {
            curl -sS -o /tmp/siren-home.html -w "%{http_code}" --max-time 25 "$1" || true
          }
          CODE=$(probe "$URL")
          if [ "$CODE" != "200" ]; then
            sleep 5
            CODE=$(probe "$URL")
          fi
          CODE=${CODE:-000}
          if [ -f /tmp/siren-home.html ]; then
            BYTES=$(wc -c </tmp/siren-home.html | tr -d ' ')
          else
            BYTES=0
          fi
          echo "homepage HTTP ${CODE}, ${BYTES} bytes"
          if [ "$CODE" != "200" ]; then
            echo "::error title=Homepage down::HTTP ${CODE} from ${URL}"
            exit 1
          fi
          if [ "$BYTES" -lt 2000 ]; then
            echo "::error title=Homepage empty::only ${BYTES} bytes"
            exit 1
          fi
          if ! grep -q 'og:image' /tmp/siren-home.html; then
            echo "::warning title=OG image::homepage is missing og:image"
          fi
          {
            echo "### Live probe"
            echo "- URL: ${URL}"
            echo "- HTTP ${CODE}, ${BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe live index health
        id: health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/siren-state.json -w "%{http_code}" --max-time 25 "https://siren.watch/api/state.json" || true)
          CODE=${CODE:-000}
          if [ "$CODE" != "200" ]; then
            echo "::error title=state.json down::HTTP ${CODE}"
            exit 1
          fi
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/siren-state.json', 'utf8'));
          const ageMin = Math.round((Date.now() - Date.parse(s.generated_at)) / 60000);
          const rate = /\b429\b|rate exceeded|too many requests/i;
          const limited = (s.sources || [])
            .filter((x) => x && !x.ok && !x.uncalibrated && rate.test(String(x.error || '')))
            .map((x) => x.id);
          const degraded = s.degraded === true;
          const out = [
            `degraded=${degraded}`,
            `age_min=${ageMin}`,
            `failed=${(s.failed_sources || []).join(',') || 'none'}`,
            `rate_limited=${limited.join(',') || 'none'}`,
            `heal=${degraded && limited.length > 0 && ageMin >= 15 ? 'true' : 'false'}`,
          ];
          console.log(out.join('\n'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n');
          const summary = [
            '### Index health',
            `- generated_at: ${s.generated_at} (${ageMin} min ago)`,
            `- degraded: ${degraded}`,
            `- failed_sources: ${(s.failed_sources || []).join(', ') || 'none'}`,
            `- rate_limited: ${limited.join(', ') || 'none'}`,
            `- level: ${s.level} ${s.level_name || ''} @ ${typeof s.score === 'number' ? s.score.toFixed(1) : 'n/a'}`,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          if (degraded && limited.length > 0) {
            console.error(`::warning title=Live index degraded::rate-limited sources: ${limited.join(', ')} (${ageMin} min old)`);
          }
          NODE

      - name: Probe aircraft feed health
        # World Monitor ADS-B / MLAT / TIS-B layers. The snapshot carries
        # aircraft_health from monitor/collect.mjs; this step pages when the
        # live monitor-data copy has error-severity issues (feed down, hubs
        # dark, snapshot stale). Warnings only annotate.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe || github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/monitor-data/monitor.json"
          CODE=$(curl -sS -o /tmp/monitor.json -w "%{http_code}" --max-time 25 "$URL" || true)
          CODE=${CODE:-000}
          echo "monitor.json HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error title=monitor snapshot down::HTTP ${CODE} from ${URL}"
            exit 1
          fi
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/monitor.json', 'utf8'));
          const h = s.aircraft_health;
          const ageMin = s.generated ? Math.round((Date.now() - Date.parse(s.generated)) / 60000) : null;
          const summary = ['### Aircraft feed health', `- generated: ${s.generated || 'n/a'} (${ageMin ?? 'n/a'} min ago)`];
          if (!h) {
            summary.push('- aircraft_health: **missing** (collector has not published the field yet)');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n\n');
            console.error('::warning title=Aircraft health::snapshot has no aircraft_health field yet');
            process.exit(0);
          }
          summary.push(`- ok: **${h.ok}**`);
          summary.push(`- mil ${h.mil} · adsb ${h.adsb} · emerg ${h.emerg}`);
          for (const i of h.issues || []) {
            summary.push(`- **${i.severity}** \`${i.id}\`: ${i.msg}`);
            console.error(`::${i.severity === 'error' ? 'error' : 'warning'} title=Aircraft ${i.id}::${i.msg}`);
          }
          if (!(h.issues || []).length) summary.push('- no issues');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n\n');
          if (!h.ok) process.exit(1);
          NODE

      - name: Dispatch heal collect
        # Only when the live site is still rate-limit-degraded after ~15 minutes.
        # Concurrency group doomcon-data serialises with any in-flight collect.
        if: steps.health.outputs.heal == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Live index is rate-limit degraded (age ${{ steps.health.outputs.age_min }} min, sources ${{ steps.health.outputs.rate_limited }}) — dispatching a heal full pass"
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" -f mode=full
          {
            echo "### Heal dispatch"
            echo "- dispatched collect.yml mode=full"
            echo "- reason: rate-limited ${{ steps.health.outputs.rate_limited }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Slack ping
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(printf '{"text":"SIREN watchdog: a launch pipeline failed or the live index is degraded. Check Actions."}')
          curl -sS -X POST -H 'content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null || true
