# Secret scan. Complements compliance/audit.mjs (legal/product tripwires and
# its own secret-in-repo regexes) with a full-history leak scanner on every
# push to main, every pull request and weekly. Dependency advisories are
# checked by the npm audit steps in compliance.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 9 * * 1'   # Mondays 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
