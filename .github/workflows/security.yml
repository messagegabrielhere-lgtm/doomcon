# Secret scan. Complements compliance/audit.mjs (legal/product tripwires and
# its own secret-in-repo regexes) with a full-history leak scanner on every
# push to main, every pull request and weekly. Dependency advisories are
# checked by the npm audit steps in compliance.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 9 * * 1'   # Mondays 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
