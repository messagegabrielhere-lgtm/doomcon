# FINDABILITY #117 — keep conquest short aliases on gh-pages while news-fast /
# collect orphan publishes can still omit them (pre-#114 tip, or race).
#
# Runs every ten minutes. No-op when /vs/{doom,skynet,takeoff}.html already
# exist beside their primaries. One small commit only when something is missing,
# so it does not add to the Pages publish storm.
#
# FINDABILITY #189 — also re-arm news-fast.yml when the minute-loop chain is
# dark. Collect schedules can go quiet for hours (observed after 19:10Z on
# 2026-10-15) while this guard keeps firing every ~10m, so it is the durable
# wake when collect-based re-arm (#188) cannot run.

name: vs-alias-guard

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # FINDABILITY #189 — dispatch news-fast.yml when the chain is dark.
  actions: write

concurrency:
  group: vs-alias-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gh-pages tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Restore missing vs short aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p vs
          restored=0
          restore_one() {
            local primary="$1" alias="$2"
            if [ ! -f "$primary" ]; then
              echo "skip $alias — primary $primary missing"
              return 0
            fi
            if [ -f "$alias" ] && cmp -s "$primary" "$alias"; then
              echo "ok $alias"
              return 0
            fi
            cp -a "$primary" "$alias"
            echo "restored $alias from $primary"
            restored=1
          }
          restore_one vs/doombench.html vs/doom.html
          restore_one vs/skynet-countdown.html vs/skynet.html
          restore_one vs/takeofftracker.html vs/takeoff.html
          # FINDABILITY #124 — /trends short alias + directory indexes.
          restore_dir() {
            local primary="$1" dir="$2"
            if [ ! -f "$primary" ]; then
              echo "skip $dir/ — primary $primary missing"
              return 0
            fi
            mkdir -p "$dir"
            if [ -f "$dir/index.html" ] && cmp -s "$primary" "$dir/index.html"; then
              echo "ok $dir/"
              return 0
            fi
            cp -a "$primary" "$dir/index.html"
            echo "restored $dir/ from $primary"
            restored=1
          }
          restore_one search-trends.html trends.html
          restore_dir search-trends.html trends
          restore_dir search-trends.html search-trends
          restore_dir verify.html verify
          restore_dir free-tools.html free-tools
          restore_dir ai-prediction-markets.html ai-prediction-markets
          # FINDABILITY #129 — unhyphenated /pdoom typed guess.
          restore_one p-doom.html pdoom.html
          restore_dir p-doom.html pdoom
          # FINDABILITY #133 — doomsday-clock / ai-doom / doom-index typed guesses.
          restore_one ai-doomsday-clock.html doomsday-clock.html
          restore_dir ai-doomsday-clock.html doomsday-clock
          restore_one guide.html ai-doom.html
          restore_dir guide.html ai-doom
          restore_one compare.html doom-index.html
          restore_one compare.html ai-doom-index.html
          restore_dir compare.html doom-index
          restore_dir compare.html ai-doom-index
          # FINDABILITY #131 — root rival brand typed guesses.
          restore_one vs/doombench.html doombench.html
          restore_one vs/doombench.html doom.html
          restore_dir vs/doombench.html doombench
          restore_dir vs/doombench.html doom
          restore_one vs/skynet-countdown.html skynet-countdown.html
          restore_one vs/skynet-countdown.html skynet.html
          restore_dir vs/skynet-countdown.html skynet-countdown
          restore_dir vs/skynet-countdown.html skynet
          restore_one vs/pizzint.html pizzint.html
          restore_dir vs/pizzint.html pizzint
          restore_one vs/takeofftracker.html takeofftracker.html
          restore_one vs/takeofftracker.html takeoff.html
          restore_dir vs/takeofftracker.html takeofftracker
          restore_dir vs/takeofftracker.html takeoff
          if [ "$restored" -ne 1 ]; then
            echo "all vs/trends/dir aliases present — nothing to publish"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vs/doom.html vs/skynet.html vs/takeoff.html \
            trends.html trends/index.html search-trends/index.html \
            verify/index.html free-tools/index.html ai-prediction-markets/index.html \
            pdoom.html pdoom/index.html \
            doomsday-clock.html doomsday-clock/index.html \
            ai-doom.html ai-doom/index.html \
            doom-index.html ai-doom-index.html doom-index/index.html ai-doom-index/index.html \
            doombench.html doom.html doombench/index.html doom/index.html \
            skynet-countdown.html skynet.html skynet-countdown/index.html skynet/index.html \
            pizzint.html pizzint/index.html \
            takeofftracker.html takeoff.html takeofftracker/index.html takeoff/index.html \
            2>/dev/null || true
          git commit -q -m "guard: restore tip aliases (FINDABILITY #117/#124/#129/#131/#133) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages; then
              echo "published alias restore"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto tip"
            git pull -q --rebase origin gh-pages || true
            sleep $((attempt * 2))
          done
          echo "::warning::could not push alias restore after 3 attempts"
          exit 0

      # FINDABILITY #189 — collect schedules went quiet for hours while this
      # guard kept firing. Mirror collect's #188 re-arm here so Google News +
      # Search Trends tip recover without a hand workflow_dispatch.
      - name: Re-arm news-fast when dark
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS_FAST_STALE_MIN: '90'
        run: |
          set -uo pipefail
          if [ "${{ vars.NEWS_FAST_CHAIN }}" = "off" ]; then
            echo "NEWS_FAST_CHAIN=off — skip re-arm"
            exit 0
          fi
          INPROG=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow news-fast.yml \
            --status in_progress -L 1 --json databaseId -q 'length' 2>/dev/null || echo 1)
          if [ "${INPROG:-1}" != "0" ]; then
            echo "news-fast already in progress — skip re-arm"
            exit 0
          fi
          # Prefer real loop events (schedule / workflow_dispatch). Ignore empty
          # push phantoms that never started a job.
          LAST_ISO=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow news-fast.yml -L 20 \
            --json createdAt,updatedAt,event,conclusion,status \
            -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .updatedAt // .createdAt] | first' \
            2>/dev/null || true)
          if [ -z "${LAST_ISO:-}" ]; then
            echo "no prior news-fast schedule/dispatch run — dispatching"
            gh workflow run news-fast.yml --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::could not re-arm news-fast (FINDABILITY #189)"
            exit 0
          fi
          AGE_MIN=$(node -e "const t=Date.parse(process.argv[1]);process.stdout.write(String(Number.isFinite(t)?Math.round((Date.now()-t)/60000):9999))" "$LAST_ISO")
          echo "newest news-fast schedule/dispatch finished ${AGE_MIN}m ago (threshold ${NEWS_FAST_STALE_MIN}m)"
          if [ "$AGE_MIN" -ge "$NEWS_FAST_STALE_MIN" ]; then
            echo "FINDABILITY #189: re-arming news-fast.yml (chain dark ${AGE_MIN}m)"
            gh workflow run news-fast.yml --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::could not re-arm news-fast (FINDABILITY #189)"
          else
            echo "news-fast fresh enough — no re-arm"
          fi
