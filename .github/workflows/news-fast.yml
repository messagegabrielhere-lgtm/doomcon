# The fast newsroom loop.
#
# WHY THIS EXISTS, AND WHY IT IS NOT A CRON
#
# The brief was "update every minute so we are never late on superintelligence".
# GitHub Actions cron cannot do that: the documented floor is five minutes, and
# under platform load scheduled runs are routinely delayed ten minutes or more.
# A `*/1` schedule would not give you a minute — it would give you an irregular
# five-to-twenty.
#
# So this is ONE job that runs for most of an hour and loops internally on a
# real sixty-second timer, re-armed every hour. Actions minutes are unlimited
# for public repositories, so the loop is free.
#
# WHAT IT DOES NOT DO
#
# It does not run the index engine. Receipts are append-only and the level
# machinery uses dwell windows measured in hours; scoring every minute would
# write ~1,400 receipts a day, silently re-weight the NowCast, and change what
# the number means. The index keeps its own beat in collect.yml. This loop is
# the newsroom only.
#
# It does not poll every source every minute either. collector/news.mjs carries
# a per-source cadence: the wires, forums and status pages are asked every
# tick because they move that fast; lab blogs and release feeds every five
# minutes; model feeds every fifteen; arXiv and the daily-paper feeds every
# hour, because they publish in daily batches and throttle hard when pushed.
# A weekly newsletter sets its own longer minIntervalMs so it does not inherit
# the wire cadence. Polling arXiv sixty times an hour buys no news and earns
# a ban.

name: news-fast

on:
  schedule:
    # Hourly re-arm. The job itself covers the hour.
    - cron: '4 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to loop (minutes)'
        required: false
        default: '50'

permissions:
  contents: write
  # To re-arm itself and to wake the index pass when GitHub drops the cron.
  actions: write

concurrency:
  # Never two loops at once: they would race on gh-pages and fight over
  # data/news.json's first_seen_at ledger.
  group: news-fast
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    # Hard ceiling below the 6h job limit, and comfortably above the loop.
    timeout-minutes: 58

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Loop
        env:
          MINUTES: ${{ github.event.inputs.minutes || '50' }}
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ vars.NEWS_FAST_CHAIN }}
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          PUBLISHED=0
          TICK=0
          LAST_WAKE=0

          while [ "$(date +%s)" -lt "$END" ]; do
            TICK=$((TICK + 1))
            START=$(date +%s)

            # EVERY TICK BUILDS FROM THE NEWEST MAIN, not from the commit this
            # job checked out when it started up to fifty minutes ago. Without
            # this the loop republished its start-of-job copy of state.json and
            # the templates over every newer deploy: measured 2026-09-28, the
            # live headline read 39.2 as of 23:19 UTC while main held 39.6 as of
            # 02:22, three hours and two full index passes later, and every
            # template change pushed mid-hour was reverted within a minute.
            # Everything is refreshed except the two files this loop owns and
            # carries forward between ticks. WORKING TREE ONLY: `git checkout
            # <commit> -- .` would also stage every refreshed file, and the
            # hourly commit below would then carry a tick-old copy of main and
            # conflict when it rebases onto the real one.
            if git fetch -q --depth=1 origin main 2>/dev/null; then
              git restore --source=FETCH_HEAD --worktree -- . ':(exclude)data/news.json' ':(exclude)data/x-surface.json' \
                || echo "::warning::tick $TICK could not refresh from main; building from the previous tick's tree"
            else
              echo "::warning::tick $TICK could not fetch main; building from the previous tick's tree"
            fi

            # WAKE THE INDEX PASS IF THE CRON DID NOT. Measured 2026-10-04: the
            # hourly schedule in collect.yml fired at 05:15, then not again
            # until 10:49. GitHub drops scheduled runs under load and says so.
            # A reading that is already past its hour is overdue: when the
            # newest state on main is more than 50 minutes old this loop asks
            # for a full pass itself, at most once every 15 minutes, so a
            # dropped :07 cron does not leave the page sitting on last hour's
            # number for another twenty minutes of slack.
            # workflow_dispatch is one of the two events GITHUB_TOKEN is
            # allowed to raise.
            AGE=$(node -e "try{const s=require('./data/state.json');process.stdout.write(String(Math.round((Date.now()-Date.parse(s.generated_at))/60000)))}catch(e){process.stdout.write('0')}")
            # Also wake a full pass when the newest reading is rate-limit
            # degraded. A green collect that published DEGRADED for arXiv 429
            # never trips the failure watchdog; without this the page sits
            # degraded until the next :07 cron. Age floor 15 min so we do not
            # re-hammer the same ban the heal step just waited out.
            NEED_HEAL=$(node -e "
              try {
                const s = require('./data/state.json');
                const rate = /\b429\b|rate exceeded|too many requests/i;
                const limited = (s.sources || []).some((x) => x && !x.ok && !x.uncalibrated && rate.test(String(x.error || '')));
                const age = (Date.now() - Date.parse(s.generated_at)) / 60000;
                process.stdout.write(s.degraded && limited && age >= 15 ? '1' : '0');
              } catch { process.stdout.write('0'); }
            ")
            NOW=$(date +%s)
            if { [ "$AGE" -gt 50 ] || [ "$NEED_HEAL" = "1" ]; } && [ $(( NOW - LAST_WAKE )) -gt 900 ] && [ "${CHAIN:-on}" != "off" ]; then
              if [ "$NEED_HEAL" = "1" ]; then
                echo "tick $TICK: reading is rate-limit degraded (${AGE} min old) — dispatching a heal full pass"
              else
                echo "tick $TICK: newest reading is ${AGE} min old — dispatching the full index pass"
              fi
              gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" -f mode=full || echo "::warning::could not dispatch collect.yml"
              LAST_WAKE=$NOW
            fi

            # Hash before/after. news.mjs rewrites the file every run (the
            # timestamp alone changes), so comparing the whole file would
            # publish every minute regardless. Compare the ITEMS only.
            BEFORE=$(node -e "try{const d=require('./data/news.json');process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(d.items.map(i=>i.id))).digest('hex'))}catch{process.stdout.write('none')}")

            node collector/news.mjs || echo "::warning::news pass $TICK failed; continuing"

            AFTER=$(node -e "try{const d=require('./data/news.json');process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(d.items.map(i=>i.id))).digest('hex'))}catch{process.stdout.write('none')}")

            if [ "$BEFORE" != "$AFTER" ]; then
              echo "tick $TICK: newsroom changed — fast rebuild and publish"
              # --only news: patch the live tree instead of wiping ~1,200 files.
              # Cards / posts / post-sheet are hourly (collect.yml); they are not
              # what makes the newsroom feel current.
              node site/build.mjs --only news --quiet \
                || { echo "::warning::news-only build failed on tick $TICK; trying full build"; node site/build.mjs --quiet || { echo "::warning::build failed on tick $TICK"; sleep 45; continue; }; }

              # Overlay onto the live gh-pages tip instead of re-tarring the
              # whole 90MB+ site. Keep .pages across ticks: a fresh shallow
              # clone is ~100MB / ~2–3s every publish; fetch+reset is seconds
              # cheaper once the working copy exists. rsync then skips the
              # ~31MB of item briefs whose bytes/mtimes did not move.
              # Falls back to a full orphan publish if refresh or push fails.
              PUB_OK=0
              PAGES_REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
              if [ -d .pages/.git ]; then
                if ! git -C .pages fetch -q origin gh-pages 2>/dev/null \
                  || ! git -C .pages reset -q --hard FETCH_HEAD 2>/dev/null; then
                  echo "tick $TICK: could not refresh .pages; recloning"
                  rm -rf .pages
                fi
              fi
              if [ ! -d .pages/.git ]; then
                rm -rf .pages
                git clone -q --depth 1 --branch gh-pages "$PAGES_REMOTE" .pages \
                  || rm -rf .pages
              fi
              if [ -d .pages/.git ]; then
                for rel in api/news.json api/state.json api/fresh.json news.html index.html classic.html instruments.html feed.xml; do
                  if [ -e "public/$rel" ]; then
                    mkdir -p ".pages/$(dirname "$rel")"
                    cp -a "public/$rel" ".pages/$rel"
                  fi
                done
                if command -v rsync >/dev/null 2>&1; then
                  if [ -d public/news ]; then mkdir -p .pages/news && rsync -a --delete public/news/ .pages/news/; fi
                  if [ -d public/item ]; then mkdir -p .pages/item && rsync -a --delete public/item/ .pages/item/; fi
                else
                  if [ -d public/news ]; then rm -rf .pages/news && cp -a public/news .pages/news; fi
                  if [ -d public/item ]; then rm -rf .pages/item && cp -a public/item .pages/item; fi
                fi
                git -C .pages config user.name  'github-actions[bot]'
                git -C .pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git -C .pages add -A
                if git -C .pages diff --cached --quiet; then
                  echo "tick $TICK: overlay had nothing new to commit"
                  PUB_OK=1
                elif git -C .pages commit -q -m "newsroom refresh — $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  && git -C .pages push -q "$PAGES_REMOTE" HEAD:gh-pages; then
                  PUB_OK=1
                fi
              fi
              if [ "$PUB_OK" -ne 1 ]; then
                echo "tick $TICK: overlay publish missed; full orphan publish"
                rm -rf .pages && mkdir .pages
                echo '.pages/' > .git/info/exclude.tmp && cat .git/info/exclude >> .git/info/exclude.tmp 2>/dev/null || true
                mv .git/info/exclude.tmp .git/info/exclude
                tar cf - -C public . | (cd .pages && tar xf -)
                git -C .pages init -q
                git -C .pages checkout -q -b gh-pages
                git -C .pages config user.name  'github-actions[bot]'
                git -C .pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git -C .pages add -A
                git -C .pages commit -q -m "newsroom refresh — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if git -C .pages push -q -f "$PAGES_REMOTE" gh-pages; then
                  PUB_OK=1
                fi
              fi
              [ "$PUB_OK" -eq 1 ] && PUBLISHED=$((PUBLISHED + 1))
            else
              echo "tick $TICK: no change"
            fi

            # Sleep the REMAINDER of the minute, not a flat 60s, so a slow pass
            # does not make the cadence drift later every iteration.
            ELAPSED=$(( $(date +%s) - START ))
            REMAIN=$(( 60 - ELAPSED ))
            [ "$REMAIN" -gt 0 ] && sleep "$REMAIN"
          done

          echo "loop finished: $TICK ticks, $PUBLISHED publishes"
          echo "PUBLISHED=$PUBLISHED" >> "$GITHUB_ENV"

      - name: Commit the newsroom state once
        # One commit per hour, not per tick. The in-job working directory keeps
        # data/news.json across iterations, so first_seen_at continuity holds
        # inside the loop; this persists the final state for the next run.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only the data files. public/ is rebuilt from them by whoever runs
          # next, and committing it here would collide with collect.yml.
          git checkout -- public 2>/dev/null || true
          # The loop refreshed the working tree from main every tick. Put
          # everything except the newsroom's own two files back to this job's
          # HEAD, so the commit and the rebase below see exactly what they
          # always saw: two data files changed, nothing else.
          git restore --source=HEAD --worktree -- . ':(exclude)data/news.json' ':(exclude)data/x-surface.json' 2>/dev/null || true
          rm -rf .pages
          git add data/news.json data/x-surface.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to persist"
            exit 0
          fi
          git commit -q -m "newsroom: $(node -e "process.stdout.write(String(require('./data/news.json').items.length))") items — $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase rather than force: collect.yml commits to main too, and the
          # loser of a race must not erase the other's work.
          # --autostash is load-bearing. The loop leaves public/ and .pages/
          # dirty, and plain `pull --rebase` refuses to run with unstaged
          # changes — which is exactly how the first live run failed after
          # publishing successfully six times.
          # Files that are NEW on main arrive in the working tree as untracked
          # files (the per-tick refresh writes them, HEAD has never heard of
          # them), and a rebase onto a main that tracks them refuses to
          # overwrite them. That failed the 11:34 run on 2026-10-04 after new
          # templates landed mid-loop. The two data files are committed by now,
          # so everything still untracked is a refreshed copy and can go.
          git clean -fdq
          for attempt in 1 2 3; do
            git pull --rebase --autostash --quiet origin main || true
            git push origin HEAD:main && break
            echo "push rejected (attempt $attempt); retrying"
            sleep 5
          done

      - name: Re-arm
        # THE LOOP KEEPS ITSELF ALIVE. The hourly cron is only a fallback: on
        # 2026-10-03/04 it started this job three times in a day. Each run now
        # queues the next one as it ends; the concurrency group holds it until
        # this run is finished, so there is never more than one loop. Set the
        # repository variable NEWS_FAST_CHAIN to "off" to stop the chain.
        if: ${{ always() && vars.NEWS_FAST_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-fast.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::could not re-arm; the hourly cron remains the fallback"
