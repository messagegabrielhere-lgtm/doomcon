# The fast newsroom loop.
#
# WHY THIS EXISTS, AND WHY IT IS NOT A CRON
#
# The brief was "update every minute so we are never late on superintelligence".
# GitHub Actions cron cannot do that: the documented floor is five minutes, and
# under platform load scheduled runs are routinely delayed ten minutes or more.
# A `*/1` schedule would not give you a minute — it would give you an irregular
# five-to-twenty.
#
# So this is ONE job that runs for most of an hour and loops internally on a
# real sixty-second timer, re-armed every hour. Actions minutes are unlimited
# for public repositories, so the loop is free.
#
# WHAT IT DOES NOT DO
#
# It does not run the index engine. Receipts are append-only and the level
# machinery uses dwell windows measured in hours; scoring every minute would
# write ~1,400 receipts a day, silently re-weight the NowCast, and change what
# the number means. The index keeps its own beat in collect.yml. This loop is
# the newsroom only.
#
# It does not poll every source every minute either. collector/news.mjs carries
# a per-source cadence: the wires, forums and status pages are asked every
# tick because they move that fast; lab blogs and release feeds every five
# minutes; model feeds every fifteen; arXiv and the daily-paper feeds every
# hour, because they publish in daily batches and throttle hard when pushed.
# A weekly newsletter sets its own longer minIntervalMs so it does not inherit
# the wire cadence. Polling arXiv sixty times an hour buys no news and earns
# a ban.

name: news-fast

on:
  schedule:
    # Hourly re-arm. The job itself covers the hour.
    - cron: '4 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to loop (minutes)'
        required: false
        default: '50'

permissions:
  contents: write
  # To re-arm itself and to wake the index pass when GitHub drops the cron.
  actions: write

concurrency:
  # Never two loops at once: they would race on gh-pages and fight over
  # data/news.json's first_seen_at ledger.
  group: news-fast
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    # Hard ceiling below the 6h job limit, and comfortably above the loop.
    timeout-minutes: 58

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Loop
        env:
          MINUTES: ${{ github.event.inputs.minutes || '50' }}
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ vars.NEWS_FAST_CHAIN }}
          # Handed to collector/news.mjs only (see the news pass below), under
          # its real name there and nowhere else. x-search.mjs holds itself to
          # one call per XAI_X_SEARCH_MINUTES and XAI_X_SEARCH_DAILY_CAP a day.
          NEWS_XAI_KEY: ${{ secrets.XAI_API_KEY }}
          # FINDABILITY #120 — news-only rebuilds rewrite index.html; keep
          # verification metas when the operator has set the secrets.
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
        # FINDABILITY #190 — Loop body extracted; inline `run: |` exceeded
        # GitHub's 21000-char expression cap and blocked workflow_dispatch
        # (vs-alias-guard re-arm 422 at 2026-10-15T22:52Z).
        run: bash .github/scripts/news-fast-loop.sh
      - name: Commit the newsroom state once
        # One commit per hour, not per tick. The in-job working directory keeps
        # data/news.json across iterations, so first_seen_at continuity holds
        # inside the loop; this persists the final state for the next run.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only the data files. public/ is rebuilt from them by whoever runs
          # next, and committing it here would collide with collect.yml.
          git checkout -- public 2>/dev/null || true
          # The loop refreshed the working tree from main every tick. Put
          # everything except the newsroom's own two files back to this job's
          # HEAD, so the commit and the rebase below see exactly what they
          # always saw: two data files changed, nothing else.
          # The leader wire's files are restored too: collect.yml owns them on
          # main, and committing this loop's copy would only race it.
          git restore --source=HEAD --worktree -- . ':(exclude)data/news.json' ':(exclude)data/x-surface.json' ':(exclude)data/bsky-surface.json' ':(exclude)data/breaking.json' ':(exclude)data/sightings.json' ':(exclude)data/xai-usage.json' 2>/dev/null || true
          rm -rf .pages
          git add data/news.json data/x-surface.json data/bsky-surface.json 2>/dev/null || true
          for f in data/breaking.json data/sightings.json data/xai-usage.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to persist"
            exit 0
          fi
          git commit -q -m "newsroom: $(node -e "process.stdout.write(String(require('./data/news.json').items.length))") items — $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase rather than force: collect.yml commits to main too, and the
          # loser of a race must not erase the other's work.
          # --autostash is load-bearing. The loop leaves public/ and .pages/
          # dirty, and plain `pull --rebase` refuses to run with unstaged
          # changes — which is exactly how the first live run failed after
          # publishing successfully six times.
          # Files that are NEW on main arrive in the working tree as untracked
          # files (the per-tick refresh writes them, HEAD has never heard of
          # them), and a rebase onto a main that tracks them refuses to
          # overwrite them. That failed the 11:34 run on 2026-10-04 after new
          # templates landed mid-loop. The two data files are committed by now,
          # so everything still untracked is a refreshed copy and can go.
          git clean -fdq
          for attempt in 1 2 3; do
            git pull --rebase --autostash --quiet origin main || true
            git push origin HEAD:main && break
            echo "push rejected (attempt $attempt); retrying"
            sleep 5
          done

      - name: Re-arm
        # THE LOOP KEEPS ITSELF ALIVE. The hourly cron is only a fallback: on
        # 2026-10-03/04 it started this job three times in a day. Each run now
        # queues the next one as it ends; the concurrency group holds it until
        # this run is finished, so there is never more than one loop. Set the
        # repository variable NEWS_FAST_CHAIN to "off" to stop the chain.
        if: ${{ always() && vars.NEWS_FAST_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-fast.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::could not re-arm; the hourly cron remains the fallback"
