              }
              # FINDABILITY #158 — restore tip /search-trends.html (+ aliases)
              # when watchlist routing FAQ is missing after orphan Publish from
              # tip < #158 (quiet firehose still needs crawlable destinations).
              restore_trends_routes_faq() {
                local root="$1" preserve="$2"
                if [ -f "$preserve/search-trends.html" ] \
                  && ! grep -qF 'Where does SIREN send IREN stock, dram stock, CoreWeave stock, and neocloud Trends?' "$root/search-trends.html" 2>/dev/null; then
                  cp -a "$preserve/search-trends.html" "$root/search-trends.html"
