# Stock snapshot for the Capitulation Scanner page (/scanner.html).
#
# Separate from the SIREN workflows on purpose: it reads only scanner/, writes
# only the scanner-data branch (one orphan commit, force-pushed, so it never
# accumulates history), and never touches main. The page fetches the JSON from
# raw.githubusercontent.com, so a run is visible within a few minutes without
# waiting for a gh-pages publish.

name: scanner-stocks

on:
  schedule:
    - cron: '12,42 13-20 * * 1-5'   # every 30 min through the US session (UTC)
    - cron: '25 21 * * 1-5'         # once after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-stocks
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scanner
            site/static
          fetch-depth: 1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Fetch candles
        run: node scanner/collect-stocks.mjs "$RUNNER_TEMP/scanner-out"

      - name: Fetch sentiment
        # optional sources; a failure here must not block the stock snapshot
        continue-on-error: true
        run: node scanner/collect-sentiment.mjs "$RUNNER_TEMP/scanner-out"

      - name: Summarize the daily picks
        # picks.json for the homepage band; runs the engine from site/static/arena.html
        continue-on-error: true
        run: node scanner/picks.mjs "$RUNNER_TEMP/scanner-out"

      - name: Publish to scanner-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/scanner-out"
          git init -q -b scanner-data
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stock snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Header, not the remote URL, so a failed push cannot store the token in .git/config.
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" scanner-data
