name: trade-scan

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - name: Offline tests (never blocks the scan)
        continue-on-error: true
        run: python3 trades/tests/test_opt_screen.py && python3 trades/tests/test_check.py && python3 trades/tests/test_stocks_parallel.py
      - name: Scan crypto, stocks, Kalshi (free public data)
        run: python3 -u trades/scan.py
      - name: Publish to trade-data branch (single overwritten commit, keeps main clean)
        run: |
          set -e
          cp -r trades/out /tmp/out
          git config user.name 'trade-scan'
          git config user.email 'trade-scan@users.noreply.github.com'
          git checkout --orphan trade-data
          git rm -rfq . || true
          cp /tmp/out/scan.md /tmp/out/scan.json .
          git add scan.md scan.json
          git commit -qm "trade-scan $(head -c 40 scan.md | head -1) [skip ci]"
          git push -f origin trade-data
