# SIREN's clock. Two lanes, one file, one queue.
#
# The operator's ask was "it should be built so the news automatically updates".
# The whole design below follows from one measurement and one platform fact.
#
# THE MEASUREMENT. A full pipeline pass costs the market adapters, the SEC feed
# and arXiv — minutes of wall clock, and arXiv answers HTTP 429 if you ask it
# much more than once an hour (observed 2026-09-24, "Rate exceeded", while
# testing the cadence). A newsroom-only pass costs a handful of RSS fetches and
# finishes in about two seconds. Putting both on the same schedule means either
# the news is slow or the markets get hammered. So: two lanes.
#
#   news  every 15 min   news -> balance -> build -> publish          ~1-2 min
#   full  hourly at :07  collect -> news -> race -> engine -> bliss -> balance
#                        -> build -> publish
#
# balance is collector/balance.mjs: the harm-and-benefit counts under /balance
# and the homepage's balance module. It runs in both lanes, straight after the
# newsroom it counts, because its beam tilts on the current window's headlines
# and a build that paired a fresh news.json with the last window's counts would
# draw a weighing of stories no longer on the page. It never fails a run and
# never replaces a good data/balance.json with a bad one; see its steps.
#
# THE PLATFORM FACT. GitHub's cron floor is five minutes, scheduled runs are
# routinely late by 5-20 minutes under load, and they are DROPPED OUTRIGHT
# during incidents. A schedule here is a hint, never a guarantee. Every step
# below is therefore written so that a SKIPPED run and a DOUBLED run are both
# harmless:
#
#   skipped  the engine reads the newest snapshot whenever it next runs, and the
#            NowCast smoother is defined over the trailing 12 observations rather
#            than over wall clock, so a gap shifts the window instead of
#            corrupting it. collector/news.mjs carries its own per-source cadence
#            ledger with 20% slack, so a late run does not double any interval.
#   doubled  the "did collect write a new snapshot" gate stops the receipt chain
#            advancing twice on one observation, and the concurrency group below
#            stops two runs pushing at the same moment.
#
# WHY :07 FOR THE FULL PASS. The */15 grid fires at :00, :15, :30 and :45.
# Minute 7 is the furthest point from all four, so a full pass (~3 min) and a
# fast pass (~2 min) have to slip by more than five minutes before they can
# collide. When they do collide the concurrency group queues them, and GitHub
# keeps only ONE pending run per group — so a third arrival cancels the queued
# one. That is survivable precisely because nothing here is a one-shot: the
# cancelled lane runs at its next tick, over the same idempotent steps.
#
# WHERE THE SITE ACTUALLY COMES FROM. Pages serves the gh-pages BRANCH for this
# repo. Committing public/ to main deploys nothing at all. The publish step
# mirrors deploy.sh: replace the branch contents wholesale so deletions
# propagate, then force-push one flat orphan commit. gh-pages therefore never
# accumulates history, which is why publishing 96 times a day is free.
#
# Cadence, failure modes and how to check freshness from outside: docs/AUTOUPDATE.md

name: collect

on:
  schedule:
    # Keep these strings EXACTLY as written. The job-level `if` below matches on
    # github.event.schedule, which is the literal cron text from this file — an
    # innocent reformat to '*/15 * * * *' vs '*/15 * * * * ' silently stops both
    # lanes from ever selecting themselves, and the workflow runs and does
    # nothing, green, forever.
    - cron: '*/15 * * * *'   # news, the fast lane
    - cron: '7 * * * *'      # the full index pass
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which lane to run by hand'
        type: choice
        options: [full, news]
        default: full

# The built-in token, not a PAT. Nothing here touches another repo, so a PAT
# would be a secret to rotate in exchange for no capability at all.
# This block is the workflow maximum. Each job narrows it: the news lane only
# pushes, and only the full lane closes issues.
permissions:
  contents: write
  issues: write

# Serialises every data-writing run across BOTH lanes. Not cancel-in-progress:
# a run cancelled between "commit" and "push" would leave the rebase retry loop
# half-done. Queue instead, and let the late run land after the early one.
concurrency:
  group: doomcon-data
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # THE FAST LANE. Newsroom only.
  #
  # It does NOT run the index engine, and that is a correctness rule rather than
  # a cost saving. Receipts are append-only and the anti-flap machinery measures
  # dwell in hours; scoring the index every fifteen minutes would write ~96
  # receipts a day, silently re-weight the NowCast and change what the number
  # means. The index keeps its own beat in the full lane. This lane is the
  # newsroom, and only the newsroom.
  # ---------------------------------------------------------------------------
  news:
    name: newsroom
    permissions:
      contents: write
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'news')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the push step rebases onto main if anything landed
          # while we were collecting, and a shallow clone cannot rebase.
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # No cache key and no install step on purpose. Zero dependencies
          # (CONTRACT.md §1) means there is nothing to restore; a cache here
          # would be ~15s of ceremony around an empty directory.

      - name: Refresh the newsroom
        # NEVER fails the job. A dark feed is a normal operating state, and
        # news.mjs exits non-zero only when EVERY source failed — which is worth
        # a warning in the log, not a red X in the operator's inbox every time a
        # CDN has a bad minute. The full lane is the one that reports outages.
        continue-on-error: true
        run: node collector/news.mjs

      - name: Did the newsroom actually change?
        id: gate
        run: |
          set -euo pipefail
          # news.mjs publishes the answer rather than making this script guess at
          # it. Every run rewrites data/news.json — generated_at moves and the
          # recency term re-decays every score by a tenth of a point — so "the
          # file differs" is true on every single pass and is useless as a deploy
          # trigger. `run.items_changed` is true only when the SET of items
          # moved, which is the only difference a reader can see.
          # Two answers, not one. `usable` says the file can be trusted at all;
          # `changed` says it is worth a deploy. They are separate because the
          # commit below must never persist a file it could not parse, and
          # because "0 items" is a collapse rather than a change — a newsroom
          # that emptied itself gets investigated, not published.
          read -r USABLE CHANGED <<<"$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            try {
              const n = JSON.parse(readFileSync("data/news.json", "utf8"));
              const r = n.run ?? {};
              const count = Array.isArray(n.items) ? n.items.length : 0;
              const changed = r.items_changed === true && count > 0;
              if (count === 0) console.error("::warning::data/news.json parsed but carries no items; refusing to publish an empty newsroom");
              process.stdout.write(`true ${changed ? "true" : "false"}`);
              console.error(`news: ${count} items, ${r.arrived ?? "?"} arrived, ${r.departed ?? "?"} departed, ${r.fetched ?? "?"}/${r.adapters ?? "?"} sources asked`);
            } catch (err) {
              process.stdout.write("false false");
              console.error(`::warning::data/news.json unreadable (${err.message}); nothing to commit or publish this pass`);
            }
          ')"
          echo "usable=$USABLE"   >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "usable=$USABLE items_changed=$CHANGED"

      - name: Recount harm and benefit
        # AFTER the newsroom and BEFORE the build, and only when the newsroom
        # changed, which is the only time this lane rebuilds. The beam on
        # /balance and on the homepage tilts on this window's headlines and on
        # nothing else (docs/BALANCE.md §4), so the counts have to be made from
        # the same news.json the build is about to render.
        #
        # NEVER FAILS THE JOB, AND NEVER REPLACES A GOOD FILE WITH A BAD ONE.
        # The collector writes its output first and exits 1 afterwards when the
        # ledger is invalid or every counter is dark, so it is pointed at a
        # scratch path outside data/ and its file is moved in only on a clean
        # exit that parses. Anything else — a non-zero exit, the 240 s ceiling,
        # a file that does not parse — leaves the previous data/balance.json
        # standing, and the site builds from it with that file's own stamp
        # printed beside the counts. The ceiling sits above the collector's own
        # 150 s per-counter watchdog; a clean run measured 2 s on 2026-09-28.
        #
        # Cost: about 9 MB of registry fetches per run (docs/BALANCE.md §10),
        # paid here only on a pass that changed the newsroom.
        if: steps.gate.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          NEXT="${RUNNER_TEMP:-/tmp}/balance.next.json"
          rm -f "$NEXT"
          if timeout 240 node collector/balance.mjs --out "$NEXT" \
             && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$NEXT"; then
            mv "$NEXT" data/balance.json
          else
            echo "::warning::collector/balance.mjs did not finish cleanly (exit $?); keeping the previous data/balance.json"
            rm -f "$NEXT"
          fi

      - name: Rebuild the site
        if: steps.gate.outputs.changed == 'true'
        # ORDER MATTERS. site/build.mjs CLEARS public/ before regenerating it, so
        # everything that writes into public/ has to run AFTER it. Measured the
        # hard way on 2026-09-23: cards written first vanished. Skipping the card
        # steps here would be the same bug wearing a hat — the share cards would
        # be deleted from public/ and the next deploy would publish a site whose
        # OpenGraph images 404 on every link anyone shares.
        run: |
          node site/build.mjs
          node collector/card.mjs
          node collector/posts.mjs
          node site/post-sheet.mjs

      - name: Commit the newsroom
        # Only when the gate could actually parse what is on disk. Committing a
        # file we failed to read would make one bad pass permanent: news.mjs
        # refuses to start against a corrupt data/news.json (it will not silently
        # erase the rolling window), so the next run, and every run after it,
        # would fail on the file this step had persisted.
        if: steps.gate.outputs.usable == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # data/news.json on every pass — including one that changed nothing
          # visible — and data/balance.json beside it (below). The newsroom
          # file carries the cadence ledger (sources[].fetched_at) and the
          # first_seen_at stamps that back the "we had this first" claim, and a
          # scheduled run is a fresh container with no memory of its own: the
          # committed file IS the process state.
          # Leaving it uncommitted would reset the ledger every pass, re-fetch all
          # sixteen sources every fifteen minutes, and re-date every item the fast
          # lane discovered between hours.
          #
          # public/ is deliberately NOT committed here. gh-pages is what Pages
          # serves and it is force-pushed as a single orphan commit, so
          # publishing costs no history at all; committing the built HTML 96
          # times a day onto main would. The full lane commits public/ hourly, so
          # main still carries a build-output archive — an hour behind the live
          # site by design.
          git add data/news.json
          # data/balance.json rides with it: the counts made from this window
          # belong in the same commit as the window. Only a clean recount ever
          # reaches data/, so whatever is on disk is either this pass's file or
          # the previous good one, and the latter adds nothing. Checked for,
          # not assumed, because before the first recount there is no file and
          # `git add` of a missing path is fatal under set -e.
          if [ -f data/balance.json ]; then git add data/balance.json; fi
          if git diff --cached --quiet; then
            echo 'newsroom unchanged; nothing to commit'
            exit 0
          fi

          SUMMARY="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const n = JSON.parse(readFileSync("data/news.json", "utf8"));
            const r = n.run ?? {};
            const when = (n.generated_at ?? "").replace(/:\d\d\.\d+Z$/, "Z");
            process.stdout.write(`news: ${n.items.length} items, +${r.arrived ?? 0}/-${r.departed ?? 0} — ${when}`);
          ')"
          git commit -m "$SUMMARY"

          # Retry, not a bare push. The concurrency group stops two scheduled
          # runs racing, but a human pushing a code change at the wrong second
          # still wins. A rebase CONFLICT is not retried away — it would mean two
          # runs wrote the same append-only file, which needs a person.
          # Two classes of file, two rules.
          #
          # REGENERATED (data/news.json, balance, leaders, race, infra, bliss,
          # digest, datacenters): every run rewrites the whole file, so there is
          # no meaningful merge and the run that commits last is simply the
          # current truth. Rebasing into a conflict here is the wrong tool — it
          # is what failed the pipeline on 2026-09-25 when the newsroom job and
          # the full index job both rewrote news.json. Replay ours onto the
          # fetched tip.
          #
          # APPEND-ONLY (data/history.ndjson, data/receipts/): a conflict there
          # really does mean two runs appended to one ledger, which needs a
          # person. Those are never force-resolved.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); replaying onto the new tip"

            CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
            if echo "$CHANGED" | grep -qE 'data/(history\.ndjson|receipts/)'; then
              # Only a real conflict if the OTHER side also appended. A code
              # push (or any commit that leaves the ledger alone) landing
              # mid-run is replayed onto cleanly with a plain rebase.
              git fetch -q origin main
              if [ -n "$(git diff --name-only HEAD~1 origin/main -- data/history.ndjson data/receipts)" ]; then
                echo '::error::append-only ledger conflicted with a concurrent run; not auto-resolving'
                exit 1
              fi
              if git rebase -q origin/main; then continue; fi
              git rebase --abort || true
              echo '::error::rebase onto a ledger-free tip failed; not auto-resolving'
              exit 1
            fi

            TMP="$(mktemp -d)"
            for f in $CHANGED; do
              [ -f "$f" ] || continue
              mkdir -p "$TMP/$(dirname "$f")"
              cp "$f" "$TMP/$f"
            done
            MSG="$(git log -1 --pretty=%B)"
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $CHANGED; do
              [ -f "$TMP/$f" ] || continue
              mkdir -p "$(dirname "$f")"
              cp "$TMP/$f" "$f"
            done
            rm -rf "$TMP"
            git add data
            if git diff --cached --quiet; then
              echo "the other run already published this; nothing to replay"
              exit 0
            fi
            git commit -q -m "$MSG"
          done
          echo '::error::could not push after 3 attempts'
          exit 1

      - name: Compliance gate
        # compliance/audit.mjs: blocks publishing if a HIGH-severity legal
        # tripwire (third-party fonts, session replay, undisclosed affiliate
        # links, leaked secrets, private info, banned X automation) reached
        # the built site. Medium findings are reported, not blocking here.
        env:
          COMPLIANCE_PII_TERMS: ${{ secrets.COMPLIANCE_PII_TERMS }}
        run: node compliance/audit.mjs --dir public

      - name: Publish to gh-pages
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .pages
          test -f public/index.html || { echo '::error::public/index.html missing; refusing to publish'; exit 1; }
          SUBJECT="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let s = {};
            try { s = JSON.parse(readFileSync("data/state.json", "utf8")); } catch {}
            const score = typeof s.score === "number" ? s.score.toFixed(1) : "NO SCORE";
            process.stdout.write(`SIREN ${s.level ?? "-"}, score ${score} — newsroom refresh`);
          ')"
          mkdir .pages
          tar cf - -C public . | (cd .pages && tar xf -)
          cd .pages
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "$SUBJECT" \
            -m "Build output from ${{ github.repository }}@${{ github.sha }} (collect/news). Do not hand-edit."
                    git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          cd ..
          rm -rf .pages
          echo "published: $SUBJECT"

  # ---------------------------------------------------------------------------
  # THE FULL LANE. The index, the race and the newsroom, once an hour.
  #
  # Hourly rather than quarter-hourly because that is how fast the inputs move:
  # arXiv publishes in daily batches, the SEC in business hours, and the
  # prediction markets in a way a 15-minute sample cannot distinguish from noise
  # at this index's smoothing. Hourly is also the cadence arXiv tolerates.
  # ---------------------------------------------------------------------------
  full:
    name: full index pass
    permissions:
      contents: write
      issues: write
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    # arXiv's 429 ladder can spend ~11 minutes waiting inside collect, and the
    # heal step below may wait another 3 minutes and re-collect. 40 minutes
    # leaves room for news/race/engine/build without killing a recover that
    # would have cleared Capability.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Preflight
        run: |
          set -euo pipefail
          # Fail here with an instruction rather than letting the engine throw a
          # stack trace 40 seconds later. reference.json is the FROZEN empirical
          # distribution every score is normalised against; it is built once from
          # backfill and committed, never regenerated live.
          if [ ! -f data/reference.json ]; then
            echo "::error::data/reference.json is missing. The index cannot be computed without the frozen reference distribution."
            echo "Build it once, locally, and commit it:"
            echo "  docker run --rm --network host -v \"\$PWD\":/app -w /app node:20-alpine node collector/backfill.mjs"
            exit 1
          fi
          for f in collector/collect.mjs collector/news.mjs collector/race.mjs collector/engine.mjs site/build.mjs; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done

      - name: Note newest snapshot before collecting
        id: before
        run: |
          set -euo pipefail
          # Recorded so the next step can prove collect produced something new.
          # Names here are ISO stamps written by collect.mjs with the colons
          # already swapped out, so nothing glob-hostile lives in this directory
          # and `ls | sort` is the exact lexicographic order engine.mjs uses to
          # pick the newest file. `|| true` because pipefail would turn "no
          # snapshots yet" into a job failure, and a first-ever run has none.
          # shellcheck disable=SC2012
          echo "snapshot=$(ls -1 data/raw/*.json 2>/dev/null | sort | tail -1 || true)" >> "$GITHUB_OUTPUT"

      - name: Collect
        id: collect
        # A dark source is a normal operating state, not an incident, and
        # collect.mjs only exits non-zero when EVERY source failed. We still do
        # not want that to abort the job here: the all-failed snapshot is
        # evidence and belongs in the repo. The run is failed at the very end
        # instead, after the evidence has been committed.
        continue-on-error: true
        env:
          # Optional. Blank, a URL, or any address containing "github" is ignored
          # and the collector uses the contact the investors job already
          # publishes (collector/infra-sources/_sec.mjs).
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node collector/collect.mjs

      - name: Cool off before more arXiv hits
        # collect, news --force and bliss all hit export.arxiv.org from the same
        # Actions IP. If the index adapter just got a 429, hammering the
        # newsroom/BLISS adapters next extends the ban. Wait out the soft
        # throttle before the next lanes ask.
        continue-on-error: true
        run: |
          set -euo pipefail
          eval "$(node collector/heal-degraded.mjs --check-raw)"
          if [ "$HEAL" = "true" ]; then
            echo "rate-limited after collect ($REASON) — cooling 90s before newsroom/BLISS"
            sleep 90
          else
            echo "no rate-limit cool-off needed ($REASON)"
          fi

      - name: Moltbook spotlight
        # What AI agents are posting about AI on moltbook.com, for /agents.html.
        # Presentation only; a failure keeps the previous data/moltbook.json.
        continue-on-error: true
        run: node collector/moltbook.mjs

      - name: Takeover Watch signals
        # Unscored autonomy signals for /si-watch.html. A failure keeps the
        # previous file; nothing here moves the index.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node collector/si-signals.mjs

      - name: Post the reading to Moltbook
        # At most every 6 hours, or when the level moves. Off until the owner
        # registers and claims the agent and adds MOLTBOOK_API_KEY.
        continue-on-error: true
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: node collector/post-moltbook.mjs

      - name: Tally's voice update
        # Tally reads a short update aloud through the xAI voice agent, every
        # 6 hours or when the level moves. Off until the XAI_API_KEY secret is
        # set; a failure keeps the previous recording.
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "$XAI_API_KEY" ] && ! command -v ffmpeg >/dev/null; then sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true; fi
          if [ -n "$XAI_API_KEY" ]; then npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0 >/dev/null && node collector/tally-voice.mjs; else echo "no XAI_API_KEY"; fi

      - name: Refresh the newsroom
        # --force ignores the per-source cadence ledger, so the hourly pass asks
        # every feed no matter how recently the fast lane did. That is the point
        # of having an hourly pass at all: no feed can hide behind its own
        # interval for longer than an hour.
        continue-on-error: true
        run: node collector/news.mjs --force

      - name: Refresh the AI race
        # Reads data/news.json for the mindshare column, so it runs AFTER news.
        # Exits non-zero only when the ranking market itself is dark; a dark
        # shipping channel is a normal Tuesday.
        continue-on-error: true
        run: node collector/race.mjs

      - name: Score
        id: score
        run: |
          set -euo pipefail
          # shellcheck disable=SC2012  # same reasoning as the earlier step
          AFTER="$(ls -1 data/raw/*.json 2>/dev/null | sort | tail -1 || true)"
          # The idempotency gate. If collect crashed before writing, the newest
          # snapshot is the one we already scored — and engine.mjs defaults to
          # "newest file in data/raw". Running it anyway would append a second
          # history line and a second receipt for the same observation, silently
          # double-weighting it in the NowCast and putting a duplicate in a hash
          # chain that is supposed to be append-only.
          if [ "$AFTER" = "${{ steps.before.outputs.snapshot }}" ]; then
            echo "::warning::collect wrote no new snapshot; skipping the engine so the receipt chain does not advance twice on one observation"
            exit 0
          fi
          node collector/engine.mjs

      - name: Heal rate-limited degradation
        # Proactive fix: when Capability is dark only because arXiv said
        # "Rate exceeded", do not publish that as the hour's reading. Wait for
        # the shared Actions IP to cool, re-collect, and re-score once. Still
        # never imputes — a second failure stays dark and is published honestly.
        id: heal
        continue-on-error: true
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          if [ ! -f data/state.json ]; then
            echo "no state.json yet; nothing to heal"
            echo "healed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eval "$(node collector/heal-degraded.mjs --check)"
          if [ "$HEAL" != "true" ]; then
            echo "no heal needed ($REASON)"
            echo "healed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Recoverable degradation ($REASON) — waiting 180s then re-collecting once"
          sleep 180
          # shellcheck disable=SC2012
          BEFORE="$(ls -1 data/raw/*.json 2>/dev/null | sort | tail -1 || true)"
          node collector/collect.mjs || true
          AFTER="$(ls -1 data/raw/*.json 2>/dev/null | sort | tail -1 || true)"
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "::warning::heal collect wrote no new snapshot"
            echo "healed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node collector/engine.mjs
          eval "$(node collector/heal-degraded.mjs --check)"
          if [ "$HEAL" = "true" ]; then
            echo "::warning::still rate-limit degraded after heal ($REASON)"
            echo "healed=false" >> "$GITHUB_OUTPUT"
          else
            echo "heal succeeded — rate-limit degradation cleared"
            echo "healed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tally's bets
        # Settles forecasts that have fallen due and writes the day's new ones,
        # from data/history.ndjson alone. Never allowed to stop the index.
        run: node collector/bets.mjs || echo "::warning::bets pass failed; the index is unaffected"

      - name: Refresh the substrate index
        # Grid, drought and buildout. Its own failure domain: ERCOT being down
        # must not stop the main index, and vice versa.
        continue-on-error: true
        run: node collector/infra.mjs

      - name: Refresh the upside index
        # BLISS has no frozen reference yet, so every source reads
        # awaiting-baseline. That is the correct cold-start state and the page
        # says so; it is not an error and must not fail the run.
        continue-on-error: true
        run: node collector/bliss.mjs

      - name: Recount harm and benefit
        # Reads data/news.json, data/state.json and data/bliss.json, so it runs
        # after the newsroom, the engine and BLISS, and before the build. The
        # same step as the fast lane's and the same two guarantees: it never
        # fails the run, and a run that does not finish cleanly — non-zero
        # exit, the 240 s ceiling, output that does not parse — leaves the
        # previous data/balance.json standing. The scratch file lives outside
        # data/, so `git add data` below can never commit a half-written one;
        # it commits data/balance.json itself whenever a clean recount
        # replaced it.
        continue-on-error: true
        run: |
          set -uo pipefail
          NEXT="${RUNNER_TEMP:-/tmp}/balance.next.json"
          rm -f "$NEXT"
          if timeout 240 node collector/balance.mjs --out "$NEXT" \
             && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$NEXT"; then
            mv "$NEXT" data/balance.json
          else
            echo "::warning::collector/balance.mjs did not finish cleanly (exit $?); keeping the previous data/balance.json"
            rm -f "$NEXT"
          fi

      - name: Refresh the datacentre map
        # DAILY AT MOST, and never in the per-minute loop. This queries the
        # public Overpass API, which is a shared volunteer resource: eleven
        # small probes in four minutes already earned a 429 and two 504s during
        # development. Running it every 60s would get this project's User-Agent
        # banned and take the map down permanently.
        #
        # The guard is the cache in data/dc-cache/ (3.1MB, committed on
        # purpose): Actions runners are ephemeral, so an uncommitted cache is a
        # cold cache on every run, which defeats the 7-day refresh policy
        # entirely. The collector only reaches the network when the cache is
        # older than its refresh window — measured from the `fetched_at` stamp
        # inside the cache file since 2026-10-03, because mtime is meaningless
        # after a checkout and the window never elapsed here before. So this
        # step now refreshes on its own, roughly weekly, instead of only when a
        # cache file is missing.
        #
        # Hence the ceiling, which this step did not have while refreshes never
        # happened: the US query walks three Overpass instances at up to 600 s
        # each, and the TIGER county download sits behind it, against this
        # job's 25-minute budget. A cold cache on a bad Overpass day must cost
        # the map one refresh, not cancel the build and publish below. `timeout`
        # exits 124 and continue-on-error absorbs it; datacenters.mjs writes
        # data/datacenters.json last, so a killed run leaves the previous file
        # standing. docs/DATACENTERS.md §8.
        continue-on-error: true
        run: timeout 480 node collector/datacenters.mjs

      - name: Refresh the world datacentre map
        # Same failure posture as the US map above, and the same guard: one
        # planet-wide Overpass query cached 7 days in
        # data/dc-cache/osm-datacenters-world.json, and Natural Earth's 1:50m
        # country polygons cached 90 days in data/dc-cache/ne-countries-50m.json.
        # Both are committed by the step below, so a run is usually free: two
        # file reads and some point-in-polygon arithmetic. It reads nothing else
        # under data/, so its place in this list only has to be before the build.
        #
        # One addition the US step does not carry: a hard ceiling. The planet
        # query answered in 66 s when measured, but the mirror walk behind it
        # allows four attempts of up to eleven minutes on each of three
        # instances — hours, against this whole job's 25-minute budget. A cold
        # cache on a bad Overpass day must cost /world one refresh, not cancel
        # the build and publish below.
        # `timeout` exits 124, continue-on-error absorbs it, and the previous
        # data/world.json stands: the collector writes it last, and only on
        # success.
        #
        # Cache age comes from the `fetched_at` stamp INSIDE each cache file,
        # not from its mtime: actions/checkout rewrites every mtime, so until
        # 2026-10-03 a committed cache always read as zero days old here and
        # neither window ever elapsed on a runner. Now it does, which means
        # this step genuinely re-harvests about once a week (and re-downloads
        # the outlines about once a quarter), and the commit step below
        # persists the newly stamped file so the next runs are cache hits
        # again. That is what `timeout 480` is sized for. docs/WORLD.md §9.
        continue-on-error: true
        run: timeout 480 node collector/world.mjs

      - name: Refresh the leader wire
        # Reads data/news.json, so it runs AFTER the newsroom. Headline-only by
        # design: it never generates a quotation, it only reproduces what a
        # publication printed, so every line stays verifiable by clicking it.
        continue-on-error: true
        run: node collector/leaders.mjs

      - name: Compile the digest
        # Runs LAST of the collectors: it reads state.json, news.json, race.json
        # and infra.json to compute what changed, so everything else must have
        # written first.
        continue-on-error: true
        run: node collector/digest.mjs

      - name: Build site
        # Runs even when the engine was skipped: the generator is a pure function
        # of data/, so a rebuild on unchanged data produces byte-identical output
        # and the commit step below simply finds nothing to commit.
        run: node site/build.mjs

      - name: Render cards and posting console
        # AFTER build.mjs, which clears public/. Same measured ordering as the
        # fast lane.
        run: |
          node collector/card.mjs
          node collector/posts.mjs
          node site/post-sheet.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `git add data`, not a list of files, is what persists the map
          # caches: it picks up data/world.json and both world caches under
          # data/dc-cache/ (osm-datacenters-world.json, ne-countries-50m.json)
          # exactly as it picks up the US map's. An uncommitted cache is a cold
          # cache on the next runner, and a cold cache is a live Overpass query.
          git add data
          if git diff --cached --quiet; then
            echo 'nothing changed; not committing'
            exit 0
          fi

          # Message reads "data: SIREN 3 @ 61.4 — 2026-09-23T02:00Z", so the
          # commit list on GitHub is a legible chart of the index over time. An
          # all-dark run genuinely has no score and says so rather than printing
          # a number we did not measure. The ${...} below are JS template
          # literals that must reach node unexpanded, hence the single quotes.
          # shellcheck disable=SC2016
          MSG="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const s = JSON.parse(readFileSync("data/state.json", "utf8"));
            const score = typeof s.score === "number" ? s.score.toFixed(1) : "NO SCORE";
            const when = (s.generated_at ?? "").replace(/:\d\d\.\d+Z$/, "Z");
            const dark = (s.dark_pillars ?? []).length;
            process.stdout.write(
              `data: SIREN ${s.level ?? "-"} @ ${score} — ${when}` +
              (dark ? ` (${dark} pillar${dark > 1 ? "s" : ""} dark)` : "")
            );
          ')"

          git commit -m "$MSG"

          # Two classes of file, two rules.
          #
          # REGENERATED (data/news.json, balance, leaders, race, infra, bliss,
          # digest, datacenters, world, and the dc-cache files): every run
          # rewrites the whole file, so there is no meaningful merge and the
          # run that commits last is simply the current truth. Rebasing into a
          # conflict here is the wrong tool — it is what failed the pipeline on
          # 2026-09-25 when the newsroom job and the full index job both
          # rewrote news.json. Replay ours onto the fetched tip.
          #
          # APPEND-ONLY (data/history.ndjson, data/receipts/): a conflict there
          # really does mean two runs appended to one ledger, which needs a
          # person. Those are never force-resolved.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); replaying onto the new tip"

            CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
            if echo "$CHANGED" | grep -qE 'data/(history\.ndjson|receipts/)'; then
              # Only a real conflict if the OTHER side also appended. A code
              # push (or any commit that leaves the ledger alone) landing
              # mid-run is replayed onto cleanly with a plain rebase.
              git fetch -q origin main
              if [ -n "$(git diff --name-only HEAD~1 origin/main -- data/history.ndjson data/receipts)" ]; then
                echo '::error::append-only ledger conflicted with a concurrent run; not auto-resolving'
                exit 1
              fi
              if git rebase -q origin/main; then continue; fi
              git rebase --abort || true
              echo '::error::rebase onto a ledger-free tip failed; not auto-resolving'
              exit 1
            fi

            TMP="$(mktemp -d)"
            for f in $CHANGED; do
              [ -f "$f" ] || continue
              mkdir -p "$TMP/$(dirname "$f")"
              cp "$f" "$TMP/$f"
            done
            MSG="$(git log -1 --pretty=%B)"
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $CHANGED; do
              [ -f "$TMP/$f" ] || continue
              mkdir -p "$(dirname "$f")"
              cp "$TMP/$f" "$f"
            done
            rm -rf "$TMP"
            git add data
            if git diff --cached --quiet; then
              echo "the other run already published this; nothing to replay"
              exit 0
            fi
            git commit -q -m "$MSG"
          done
          echo '::error::could not push after 3 attempts'
          exit 1

      - name: Compliance gate
        # compliance/audit.mjs: blocks publishing if a HIGH-severity legal
        # tripwire (third-party fonts, session replay, undisclosed affiliate
        # links, leaked secrets, private info, banned X automation) reached
        # the built site. Medium findings are reported, not blocking here.
        env:
          COMPLIANCE_PII_TERMS: ${{ secrets.COMPLIANCE_PII_TERMS }}
        run: node compliance/audit.mjs --dir public

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .pages
          test -f public/index.html || { echo '::error::public/index.html missing; refusing to publish'; exit 1; }
          SUBJECT="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const s = JSON.parse(readFileSync("data/state.json", "utf8"));
            const score = typeof s.score === "number" ? s.score.toFixed(1) : "NO SCORE";
            process.stdout.write(`SIREN ${s.level ?? "-"}, score ${score} — ${s.generated_at ?? "unknown"}`);
          ')"
          mkdir .pages
          tar cf - -C public . | (cd .pages && tar xf -)
          cd .pages
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "$SUBJECT" \
            -m "Build output from ${{ github.repository }}@${{ github.sha }} (collect/full). Do not hand-edit."
                    git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          cd ..
          rm -rf .pages
          echo "published: $SUBJECT"

      - name: Close data reports the new reading answers
        # Visitors' "missing new data" issues filed before this reading are
        # answered and closed (collector/issue-bot.mjs settle).
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node collector/issue-bot.mjs settle

      - name: Fail the run if every index source was dark
        if: steps.collect.outcome == 'failure'
        # SOME sources dark is normal and is reported on the page, never here.
        # EVERY source dark means we learned nothing this hour, and that is the
        # one condition worth an email. The snapshot was already committed above
        # as evidence and gh-pages was already refreshed, so failing here costs
        # the operator nothing but the notification.
        run: |
          echo '::error::every index source failed this run — the snapshot was committed as evidence, but we learned nothing. Check collector/fetch.mjs and the source endpoints.'
          exit 1
