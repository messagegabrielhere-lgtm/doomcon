name: issue-desk
# Answers reports filed from the site (feedback.html) within a minute: checks
# the reading and the page, starts a fresh data run for data reports, and
# labels anything that needs a person. collect.yml closes data reports once a
# newer reading is live. See collector/issue-bot.mjs.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
# Workflow maximum. The comment job only reopens an issue; it must not be able
# to dispatch workflows. Triage is the only job that starts collect.yml.
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  triage:
    permissions:
      contents: read
      issues: write
      actions: write
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node collector/issue-bot.mjs triage "$ISSUE_NUMBER"
  reopen:
    # A visitor replying on an issue the desk closed reopens it for a person.
    # issues: write only. A comment must not inherit actions: write.
    permissions:
      issues: write
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'closed' &&
      github.event.comment.user.type != 'Bot' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Reopen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=open >/dev/null
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" -f 'labels[]=needs-human' >/dev/null
