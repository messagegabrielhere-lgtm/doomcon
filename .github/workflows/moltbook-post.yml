name: moltbook-post
# Posts the next unposted item in data/moltbook-queue.json from the SIREN agent
# on Moltbook (collector/post-moltbook-once.mjs). Run by hand. One post per run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: moltbook-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Post
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then node collector/post-moltbook-once.mjs --dry-run; else node collector/post-moltbook-once.mjs; fi
      - name: Record what was posted
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          [ -f data/moltbook-queue-posted.json ] || exit 0
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/moltbook-queue-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "moltbook: posted from the queue — $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase -q origin main
          done
          exit 1
