name: moltbook-post
# Posts the next unposted item in data/moltbook-queue.json from the SIREN agent
# on Moltbook (collector/post-moltbook-once.mjs). Run by hand. One post per run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
      answer:
        description: Answer to the pending verification challenge (leave empty to post the next item)
        type: string
        default: ''
      status_of:
        description: A post id to look up instead of posting
        type: string
        default: ''

permissions:
  contents: write
concurrency:
  group: moltbook-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Post
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          DRY: ${{ inputs.dry_run }}
          ANSWER: ${{ inputs.answer }}
          STATUS: ${{ inputs.status_of }}
        run: |
          if [ -n "$STATUS" ]; then node collector/post-moltbook-once.mjs --status "$STATUS";
          elif [ -n "$ANSWER" ]; then node collector/post-moltbook-once.mjs --verify "$ANSWER";
          elif [ "$DRY" = "true" ]; then node collector/post-moltbook-once.mjs --dry-run;
          else node collector/post-moltbook-once.mjs; fi
      - name: Record what was posted
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          [ -f data/moltbook-queue-posted.json ] || [ -f data/moltbook-pending.json ] || exit 0
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/moltbook-queue-posted.json data/moltbook-pending.json 2>/dev/null || git add data/moltbook-queue-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "moltbook: posted from the queue — $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase -q origin main
          done
          exit 1
