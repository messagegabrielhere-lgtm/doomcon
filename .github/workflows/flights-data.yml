# Flight Report Card snapshot (/flights.html).
#
# Same shape as scanner-stocks.yml and monitor-data.yml: reads flights/ and
# collector/fetch.mjs; writes only the flights-data branch (one orphan commit,
# force-pushed, so it never accumulates history); never touches main. The page
# reads the JSON from raw.githubusercontent.com.
#
# BTS publishes one month of on-time data at a time, about two months behind,
# so a weekly pass is enough to pick up each new month. A run downloads the
# newest 12 monthly archives (roughly 30 MB each). A failed run publishes
# nothing at all, and the previous snapshot stays up.

name: flights-data

on:
  schedule:
    - cron: '23 9 * * 1'   # Mondays 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flights-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            flights
            collector
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Test
        run: node --test flights/test.mjs

      - name: Collect
        run: node flights/collect.mjs "$RUNNER_TEMP/flights-out"

      - name: Publish to flights-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/flights-out"
          git init -q -b flights-data
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flight snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" flights-data; then
              exit 0
            fi
            echo "flights-data push rejected (attempt $attempt); retrying"
            sleep $((attempt * 2))
          done
          echo '::error::could not publish to flights-data after 3 attempts'
          exit 1
