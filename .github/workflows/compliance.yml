# Compliance audit (compliance/audit.mjs).
#
# Runs on every push and pull request, and daily so the market-regime checks
# (compliance/markets.mjs), new rules and expiring allow-list entries are
# re-checked even when nothing changed.
#   1. selftest: every rule must catch a planted violation and clear on the fix,
#      so a rule that silently breaks fails here instead of giving a false PASS.
#   2. audit --strict: fails on HIGH or MEDIUM findings in the repo, and writes
#      compliance/REMEDIATION.md (uploaded as an artifact) with the daily
#      market-regime checklist.
#   3. npm audit on both lockfiles (root arena SDK, clipper/): high/critical
#      advisories in declared dependencies fail the run.
# The deploy in collect.yml has its own gate (HIGH only) on the built site.
#
# Optional secret COMPLIANCE_PII_TERMS: comma-separated private terms (real
# name, personal email, phone) that must never appear in this public repo.
# Matches are reported by file and line only; the terms are never printed.

name: compliance

on:
  push:
  pull_request:
  schedule:
    - cron: '17 13 * * *'   # daily 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Drop superseded PR/push audits so the Actions list stays readable.
# Scheduled and manual runs are never cancelled.
concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Rule self-test
        run: node compliance/selftest.mjs
      - name: Audit
        env:
          COMPLIANCE_PII_TERMS: ${{ secrets.COMPLIANCE_PII_TERMS }}
        run: node compliance/audit.mjs --strict --report
      - name: Upload remediation plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-remediation
          path: compliance/REMEDIATION.md
          if-no-files-found: ignore
      - name: npm audit (root lockfile)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: npm audit (clipper lockfile)
        working-directory: clipper
        run: npm audit --package-lock-only --omit=dev --audit-level=high
