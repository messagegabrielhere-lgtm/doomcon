# One-off diagnostic for the SEC full-text source (403 from runners since
# 2026-10-06). Manual only. Prints each header combination's HTTP status as an
# annotation, readable from the run page. Delete once the source is fixed.
name: probe-sec
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe efts.sec.gov
        run: |
          U='https://efts.sec.gov/LATEST/search-index?q=%22artificial+intelligence%22&dateRange=custom&startdt=2026-09-08&enddt=2026-10-08'
          M='331486973+messagegabrielhere-lgtm@users.noreply.github.com'
          probe() { c=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 20 "$@" "$U"); echo "::notice::$c <- $*  $(head -c 90 /tmp/b | tr -d '\n')"; }
          probe -A "SIREN AI Index $M"
          probe -A "SIREN AI Index $M" -H 'Accept-Encoding: gzip, deflate' -H 'Accept: application/json'
          probe -A "SIREN/1.0 ($M)"
          probe -A "SIREN Research $M" -H 'Host: efts.sec.gov' --compressed
          probe -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          probe -6 -A "SIREN AI Index $M"
          c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "SIREN AI Index $M" 'https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=10&output=atom'); echo "::notice::www.sec.gov atom: $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "SIREN AI Index $M" 'https://data.sec.gov/submissions/CIK0001045810.json'); echo "::notice::data.sec.gov: $c"
