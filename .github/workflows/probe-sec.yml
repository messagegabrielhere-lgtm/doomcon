# One-off diagnostic: does SEC accept the declared contact from the secret?
# Prints status codes only (never the address). Delete after use.
name: probe-sec
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          M: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          U='https://efts.sec.gov/LATEST/search-index?q=%22artificial+intelligence%22&dateRange=custom&startdt=2026-09-08&enddt=2026-10-08'
          echo "::notice::secret present: $([ -n "$M" ] && echo yes || echo NO) length ${#M}"
          for ua in "SIREN AI Index $M" "SIREN/1.0 ($M)" "Siren Index $M" "$M"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "$ua" -H 'Accept-Encoding: gzip, deflate' "$U")
            echo "::notice::$c <- variant $(echo "$ua" | sed "s/$M/<email>/")"
          done
